[package]
name = "firmware"
version = "0.1.0"
authors = ["Rehan <ezybro030@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[dependencies]
log = "0.4"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
esp-idf-svc = { version = "0.53", features = ["critical-section"] }
esp-idf-hal = "0.47"
esp-idf-sys = "0.38"

[build-dependencies]
embuild = "0.33.5"
